<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470">
  <rect width="900" height="470" fill="white"/>
  <text x="450" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold">Model: Sequential Composition of Layers</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <rect x="40" y="90" width="140" height="60" rx="8" ry="8" fill="#dbe9ff" stroke="#1E78D8" stroke-width="1.5"/>
  <text x="110" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#000" font-weight="bold" font-style="normal">Input</text>
  <text x="110" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000" font-weight="normal" font-style="normal">x (n values)</text>
  <rect x="200" y="90" width="140" height="60" rx="8" ry="8" fill="#e2f5e2" stroke="#228B22" stroke-width="1.5"/>
  <text x="270" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#000" font-weight="bold" font-style="normal">Layer 1</text>
  <text x="270" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000" font-weight="normal" font-style="normal">a₁ = f₁(W₁x + b₁)</text>
  <rect x="360" y="90" width="140" height="60" rx="8" ry="8" fill="#e2f5e2" stroke="#228B22" stroke-width="1.5"/>
  <text x="430" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#000" font-weight="bold" font-style="normal">Layer 2</text>
  <text x="430" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000" font-weight="normal" font-style="normal">a₂ = f₂(W₂a₁ + b₂)</text>
  <text x="590" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#000" font-weight="normal" font-style="normal">…</text>
  <rect x="680" y="90" width="180" height="60" rx="8" ry="8" fill="#e2f5e2" stroke="#228B22" stroke-width="1.5"/>
  <text x="770" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#000" font-weight="bold" font-style="normal">Layer L</text>
  <text x="770" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#000" font-weight="normal" font-style="normal">ŷ = f_L(W_L a_{L−1} + b_L)</text>
  <line x1="182" y1="112" x2="198" y2="112" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="198" y1="132" x2="182" y2="132" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="342" y1="112" x2="358" y2="112" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="358" y1="132" x2="342" y2="132" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="502" y1="112" x2="560" y2="112" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="132" x2="502" y2="132" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="112" x2="676" y2="112" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="676" y1="132" x2="620" y2="132" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333" font-weight="normal" font-style="normal">forward: each layer's output is the next layer's input</text>
  <text x="450" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#C0392B" font-weight="normal" font-style="normal">backward: each layer maps ∂L/∂a_ℓ to ∂L/∂a_{ℓ−1} and keeps its own ∂L/∂W_ℓ, ∂L/∂b_ℓ</text>
  <rect x="40" y="210" width="820" height="70" rx="8" ry="8" fill="#fff0d9" stroke="#E08A00" stroke-width="1.5"/>
  <text x="450" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#000" font-weight="bold" font-style="normal">Flat parameter vector θ with P entries (same order for export and import)</text>
  <text x="450" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#000" font-weight="normal" font-style="normal">θ = [ W₁ row-major, b₁, W₂ row-major, b₂, …, W_L row-major, b_L ],   P = Σ m_ℓ (n_ℓ + 1)</text>
  <rect x="40" y="310" width="250" height="70" rx="8" ry="8" fill="#f3e3ff" stroke="#8A2BE2" stroke-width="1.5"/>
  <text x="165" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#000" font-weight="bold" font-style="normal">Objective J(θ)</text>
  <text x="165" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000" font-weight="normal" font-style="normal">user-supplied cost + gradient</text>
  <rect x="330" y="310" width="250" height="70" rx="8" ry="8" fill="#f3e3ff" stroke="#8A2BE2" stroke-width="1.5"/>
  <text x="455" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#000" font-weight="bold" font-style="normal">Optimizer</text>
  <text x="455" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000" font-weight="normal" font-style="normal">θ* = argmin J(θ) from θ₀</text>
  <rect x="620" y="310" width="240" height="70" rx="8" ry="8" fill="#fff0d9" stroke="#E08A00" stroke-width="1.5"/>
  <text x="740" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#000" font-weight="bold" font-style="normal">Load θ* into the layers</text>
  <text x="740" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#000" font-weight="normal" font-style="normal">then run inference</text>
  <line x1="292" y1="345" x2="326" y2="345" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="582" y1="345" x2="616" y2="345" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555" font-weight="normal" font-style="normal">Today's training step optimises J over θ directly. Backpropagation-based training over a</text>
  <text x="450" y="433" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555" font-weight="normal" font-style="normal">dataset (per-sample loss on ŷ, exposed parameter gradients, mini-batches) is roadmap N8 / N9 / N16.</text>
</svg>
